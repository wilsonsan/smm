services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: smm_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql://root:root_password@db:3306/smm_dev
      APP_URL: http://127.0.0.1:3196
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_BYTES: "26214400"
      SESSION_TTL_HOURS: "168"
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-this-before-seeding
      FACEBOOK_APP_ID: ""
      FACEBOOK_APP_SECRET: ""
    ports:
      - "3196:3000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  mysql-data:
